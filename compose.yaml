services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://v1_user:${POSTGRES_PASSWORD}@db:5432/v1_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: v1_db
      POSTGRES_USER: v1_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U v1_user -d v1_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

